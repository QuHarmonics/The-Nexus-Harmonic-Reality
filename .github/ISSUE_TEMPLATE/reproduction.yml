name: Reproduction or correction
description: Record an execution or a discrepancy
title: "[RUN] "
body:
  - type: textarea
    id: scope
    attributes:
      label: Source revision, environment and scope
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Command, expected result, observed output and return route
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Seal, evidence, corrections and unresolved dependencies
