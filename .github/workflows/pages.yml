name: Publish public portal and Python laboratory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/observatory/**'
      - 'docs/index.html'
      - 'tools/smoke_workbench.mjs'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Exercise the workbench in headless Chromium
        run: |
          npm install --prefix /tmp/nexus-ui --no-audit --no-fund playwright@1.56.1
          export PLAYWRIGHT_MODULE=/tmp/nexus-ui/node_modules/playwright/index.mjs
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then /tmp/nexus-ui/node_modules/.bin/playwright install chromium; fi
          node tools/smoke_workbench.mjs
      - name: Build static site and JupyterLite laboratory
        run: |
          python3 -m venv /tmp/nexus-lite
          /tmp/nexus-lite/bin/python -m pip install 'jupyterlite-core==0.8.7' jupyterlite-pyodide-kernel 'jupyter-server>=2,<3' plotly ipywidgets
          /tmp/nexus-lite/bin/python -c 'import jupyter_server; print("Jupyter Server", jupyter_server.__version__)'
          /tmp/nexus-lite/bin/python tools/prepare_browser_lab.py
          mkdir -p _site
          cp -a docs/. _site/
          /tmp/nexus-lite/bin/jupyter lite build --lite-dir "$PWD" --contents "$PWD/_browser_lab" --output-dir "$PWD/_site/lab"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("<!-- ATLAS_BROWSER_LINK -->", '<a href="lab/lab/index.html?path=NEXUS_Ring_Atlas_Browser.ipynb"><b>Open full Atlas in Jupyter</b><span>Optional notebook environment in your browser</span></a>')
          p.write_text(s, encoding="utf-8")
          PY
          test -f _site/lab/lab/index.html
          test -f _site/lab/files/NEXUS_Ring_Atlas_Browser.ipynb
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
